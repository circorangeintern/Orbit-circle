<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="100%" height="100%">
  <defs>
    <!-- Background Soft Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#773BEC" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0B0B14" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Pink/Purple Gradient for Numbers -->
    <linearGradient id="num3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF758F" />
      <stop offset="50%" stop-color="#FF4D6D" />
      <stop offset="100%" stop-color="#C9184A" />
    </linearGradient>

    <!-- Shadow Gradient -->
    <linearGradient id="shadow3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Magnifier Metallic Gradient -->
    <linearGradient id="metalGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#773BEC" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .star { fill: #FFFFFF; opacity: 0.5; }
  </style>

  <!-- Ambient Glow -->
  <circle cx="160" cy="130" r="120" fill="url(#bgGlow)" />

  <!-- Floating Star / Sparkle Elements -->
  <g>
    <path class="star" d="M 60 40 Q 60 50 50 50 Q 60 50 60 60 Q 60 50 70 50 Q 60 50 60 40 Z" />
    <path class="star" d="M 260 60 Q 260 70 250 70 Q 260 70 260 80 Q 260 70 270 70 Q 260 70 260 60 Z" opacity="0.8" />
    <circle cx="280" cy="170" r="3" fill="#FF758F" opacity="0.7" />
    <circle cx="40" cy="180" r="2.5" fill="#773BEC" opacity="0.8" />
  </g>

  <!-- 3D 404 Visual Group -->
  <g filter="url(#dropShadow)" transform="translate(0, 10)">
    <!-- First '4' -->
    <g transform="translate(30, 20)">
      <!-- Extrusion / 3D Shadow -->
      <path d="M 45 30 L 15 85 L 60 85 L 60 110 L 85 110 L 85 85 L 100 85 L 100 60 L 85 60 L 85 30 Z" fill="#800F2F" rx="8" />
      <!-- Top Face -->
      <path d="M 40 25 L 10 80 L 55 80 L 55 105 L 80 105 L 80 80 L 95 80 L 95 55 L 80 55 L 80 25 Z" fill="url(#num3D)" />
      <!-- Inner Cutout Shadow -->
      <path d="M 42 60 L 60 60 L 60 38 Z" fill="#A4133C" />
    </g>

    <!-- Center 3D Planet Search Orb ('0') -->
    <g transform="translate(160, 80)">
      <!-- Outer Ring -->
      <ellipse cx="0" cy="0" rx="42" ry="18" fill="none" stroke="#FF758F" stroke-width="4" transform="rotate(-15)" opacity="0.7" />
      
      <!-- Orb Main Body -->
      <circle cx="0" cy="0" r="32" fill="url(#num3D)" />
      
      <!-- Glossy Highlight Overlay -->
      <path d="M -20 -15 A 25 25 0 0 1 15 -20 A 28 28 0 0 0 -20 -15 Z" fill="#FFFFFF" opacity="0.45" />

      <!-- Cross Warning Badge -->
      <circle cx="16" cy="16" r="12" fill="#151326" />
      <circle cx="16" cy="16" r="10" fill="#F87171" />
      <path d="M 12 12 L 20 20 M 20 12 L 12 20" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Second '4' -->
    <g transform="translate(200, 20)">
      <!-- Extrusion / 3D Shadow -->
      <path d="M 45 30 L 15 85 L 60 85 L 60 110 L 85 110 L 85 85 L 100 85 L 100 60 L 85 60 L 85 30 Z" fill="#800F2F" />
      <!-- Top Face -->
      <path d="M 40 25 L 10 80 L 55 80 L 55 105 L 80 105 L 80 80 L 95 80 L 95 55 L 80 55 L 80 25 Z" fill="url(#num3D)" />
      <!-- Inner Cutout Shadow -->
      <path d="M 42 60 L 60 60 L 60 38 Z" fill="#A4133C" />
    </g>
  </g>

  <!-- Ground Floor Shadow -->
  <ellipse cx="160" cy="225" rx="100" ry="10" fill="#000000" opacity="0.3" />
</svg>
